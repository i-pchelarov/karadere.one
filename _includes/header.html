<header class="fixed w-full z-50 bg-slate-950/90 backdrop-blur border-b border-slate-800">

    <!-- Menu -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        <!-- Logo -->
        <a href="#" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-full bg-teal-500/20 border border-teal-500 flex items-center justify-center text-teal-400 group-hover:scale-105 transition-transform">
                <i class="fa-solid font-bold fa-water text-xl"></i>
            </div>
            <div>
                <span class="text-lg font-bold tracking-tight text-white block leading-none">Карадере</span>
                <span class="text-xs text-teal-400 font-mono">karadere.one</span>

        <!-- Десктоп меню -->
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
            <a href="#about" class="hover:text-teal-400 transition-colors">За Карадере</a>
            <a href="#principles" class="hover:text-teal-400 transition-colors">Принципи</a>

        <div class="hidden md:flex items-center gap-4">

            </button>

        <!-- Бутон за мобилно меню -->

        <a href="#principles" class="block text-slate-300 hover:text-teal-400">Принципи</a>

        <button onclick="openDonateModal()" class="w-full bg-amber-500 text-slate-950 font-semibold py-3 rounded-lg">
