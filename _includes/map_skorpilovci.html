<!-- _includes/map_skorpilovtsi.html -->
<div class="relative w-full rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 shadow-2xl flex flex-col">

    <!-- Панел за управление (Zoom & Pan Controls) -->
    <div class="absolute top-4 right-4 z-20 flex flex-col gap-2 bg-slate-900/80 p-2 rounded-xl border border-slate-800 backdrop-blur-md shadow-lg">
        <button id="zoom-in" class="w-10 h-10 flex items-center justify-center text-slate-200 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-lg transition-colors" title="Приближаване">
            <i class="fa-solid fa-plus text-base"></i>
        </button>
        <button id="zoom-out" class="w-10 h-10 flex items-center justify-center text-slate-200 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-lg transition-colors" title="Отдалечаване">
            <i class="fa-solid fa-minus text-base"></i>
        </button>
        <button id="zoom-reset" class="w-10 h-10 flex items-center justify-center text-slate-200 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-lg transition-colors" title="Центриране / Ресет">
            <i class="fa-solid fa-rotate-left text-sm"></i>
        </button>
    </div>

    <!-- Индикатор за инструкция -->
    <div class="absolute bottom-4 left-4 z-20 pointer-events-none hidden sm:flex items-center gap-2 bg-slate-950/70 px-3 py-1.5 rounded-lg border border-slate-800/80 text-xs font-mono text-slate-400 backdrop-blur-md">
        <i class="fa-solid fa-hand-pointer text-teal-400 animate-pulse"></i>
        <span>Използвайте влачене и скрол за навигация</span>
    </div>

    <!-- SVG Вюпорт контейнер -->
    <div id="map-viewport" class="w-full h-[450px] sm:h-[600px] cursor-grab active:cursor-grabbing overflow-hidden relative select-none">
        <div id="map-container" class="w-full h-full flex items-center justify-center origin-center transition-transform duration-75 ease-out">
            <!-- Вграждане на SVG картата -->
            <img id="svg-map" src="/web/img/bg0000100_map_sat.svg" alt="Карта на Защитена зона BG0000100 Плаж Шкорпиловци" class="w-full h-full object-contain pointer-events-none" />
        </div>
    </div>
</div>

<!-- JavaScript за Zoom & Pan управление -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const viewport = document.getElementById('map-viewport');
        const container = document.getElementById('map-container');
        const btnZoomIn = document.getElementById('zoom-in');
        const btnZoomOut = document.getElementById('zoom-out');
        const btnReset = document.getElementById('zoom-reset');

        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function updateTransform() {
            container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // Zoom In/Out подобрения
        function zoom(delta) {
            const prevScale = scale;
            scale = Math.min(Math.max(0.8, scale + delta), 5);
            updateTransform();
        }

        btnZoomIn.addEventListener('click', () => zoom(0.3));
        btnZoomOut.addEventListener('click', () => zoom(-0.3));

        btnReset.addEventListener('click', () => {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        });

        // Скрол с мишка за приближаване
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.2 : -0.2;
            zoom(delta);
        }, { passive: false });

        // Drag & Pan с мишка
        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch събития за мобилни устройства
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                updateTransform();
            }
        }, { passive: true });

        viewport.addEventListener('touchend', () => {
            isDragging = false;
        });
    });
</script>
