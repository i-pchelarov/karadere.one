<!-- Modal: Стани съмишленик -->
<div id="member-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-container" role="dialog" aria-labelledby="member-modal-title">

        <!-- Бутон за затваряне -->
        <button type="button" class="modal-close" id="close-member-modal" aria-label="Затвори">
            &times;
        </button>

        <!-- Заглавие на модала -->
        <div class="modal-header">
            <h3 id="member-modal-title">Заявление за членство</h3>
            <p>Стани част от Сдружение „Природосъобразно Карадере“ и помогни да запазим дивата природа.</p>
        </div>

        <!-- Форма за членство -->
        <form id="member-form" class="modal-form" action="https://formsubmit.co/karadere.org@gmail.com" method="POST">

            <div class="form-group">
                <label for="member-name">Две имена *</label>
                <input type="text" id="member-name" name="name" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label for="member-email">Имейл адрес *</label>
                <input type="email" id="member-email" name="email" placeholder="ivan@example.com" required>
            </div>

            <div class="form-group">
                <label for="member-phone">Телефонен номер *</label>
                <input type="tel" id="member-phone" name="phone" placeholder="+359 88 123 4567" required>
            </div>

            <!-- Декларация и съгласие с условията -->
            <div class="form-checkbox-group">
                <input type="checkbox" id="member-terms" name="terms" required>
                <label for="member-terms">
                    Запознат/а съм и приемам <a href="/terms.html" target="_blank" rel="noopener">Условията за членство</a> и <a href="/rules.html" target="_blank" rel="noopener">Правилника на сдружението</a>. *
                </label>
            </div>

            <!-- Бутон за изпращане -->
            <button type="submit" class="btn btn-primary btn-full">
                Подай заявление
            </button>

            <p class="form-notice">
                🔒 Вашите данни са защитени и ще бъдат използвани единствено за целите на Сдружението.
            </p>
        </form>

    </div>
</div>
